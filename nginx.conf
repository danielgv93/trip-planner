server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The collaboration stream (`/api/trips/:id/events`) is server-sent
        # events: buffering would hold every message until the stream closed,
        # and the default read timeout would cut an idle group's connection.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        # Native ES modules have unversioned URLs. Without an explicit policy
        # browsers apply heuristic caching and can keep running modules from a
        # previous deploy, whose portable-plan codec no longer matches the
        # server's. Revalidating with the ETag keeps every tab on the deploy.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
